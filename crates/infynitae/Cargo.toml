[package]
name = "infynitae"
description = "Infynitae Native composition root (FOUNDATION_ARCHITECTURE C1.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
infynitae-core = { path = "../infynitae-core" }
infynitae-wayland = { path = "../infynitae-wayland" }
infynitae-backend-headless = { path = "../infynitae-backend-headless" }
infynitae-backend-winit = { path = "../infynitae-backend-winit" }
infynitae-backend-drm = { path = "../infynitae-backend-drm" }
infynitae-ipc = { path = "../infynitae-ipc" }
# SO_PEERCRED for the shell socket's admission (C7.1; owner decision 2026-10-20, D1): already in
# the tree through Smithay, with these features; safe API, no `unsafe` here.
rustix = { version = "1.1.5", default-features = false, features = ["net", "process", "std"] }
