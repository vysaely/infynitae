[package]
name = "infynitae-core"
description = "Spatial and policy authority of Infynitae Native (FOUNDATION_ARCHITECTURE C1.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# INV-ARCH-1: core has no dependencies (std only). tools/verify-architecture enforces it.
[dependencies]

# Negative probes (OB-19). Each feature adds ONE forbidden authority path to core-internal code;
# tools/verify-architecture builds it alone and requires the build to fail with the asserted
# diagnostic and no other error. Never enabled by default or by any product crate.
[features]
probe_protocol_moves_camera = []
probe_protocol_refits_camera = []
probe_protocol_creates_camera = []
probe_sticky_fit_retains_authority = []
probe_unsafe_block = []
probe_unsafe_allow_override = []
# Runtime 2i negative control (OB-49): the sealed 2R binding rule, which steals a bound camera.
# tools/verify-architecture requires the 1:1 collision tests to fail with "1:1 violated" under it.
probe_sealed_key_steal = []
# INV-INPUT-3 bypass switch (TST-05 negative control): pan motion also reaches the client.
# tools/verify-architecture requires the x8 KeepFocus tests to fail under it.
probe_pan_motion_bypass = []
