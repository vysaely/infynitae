[package]
name = "infynitae-backend-headless"
description = "Headless test backend of Infynitae Native (FOUNDATION_ARCHITECTURE C1.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# C1.2: may depend on core, wayland and Smithay backend features; never on the other backend.
[dependencies]
infynitae-core = { path = "../infynitae-core" }
infynitae-wayland = { path = "../infynitae-wayland" }
# C1.3: the headless backend renders with Smithay's test renderer.
smithay = { version = "=0.7.0", default-features = false, features = ["renderer_test"] }

# Runtime 2i negative control (OB-49) on the T1 path; see tools/verify-architecture. Never enabled
# by default.
[features]
probe_sealed_key_steal = ["infynitae-core/probe_sealed_key_steal"]
# INV-INPUT-3 bypass switch (TST-05); see tools/verify-architecture. Never enabled by default.
probe_pan_motion_bypass = ["infynitae-core/probe_pan_motion_bypass"]
probe_preemption_strategy = ["infynitae-wayland/probe_preemption_strategy"]
probe_nested_grab_keep_pointer = ["infynitae-wayland/probe_nested_grab_keep_pointer"]
probe_test_keyboard_grab = ["infynitae-wayland/probe_test_keyboard_grab"]

# T1 probe clients over socketpairs (FOUNDATION_TEST_PLAN T1; C1.2 testing row). Test-only.
[dev-dependencies]
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
