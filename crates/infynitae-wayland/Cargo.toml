[package]
name = "infynitae-wayland"
description = "Smithay adapter of Infynitae Native (FOUNDATION_ARCHITECTURE C1.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
infynitae-core = { path = "../infynitae-core" }
# INV-ARCH-3 / ADR-13: exact pin, published crate only (no git source, no [patch]; P1 stays in
# experiments/e1r-smithay-p1 until OB-11 is decided). Features per C1.3.
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
# Owner decision 2026-10-19: SIGTERM/SIGINT/SIGCHLD reach the event loop through a self-pipe
# (`signals`, its `unsafe` listed in UNSAFE_INVENTORY U-005/U-006); signal-hook rejected, libc used
# instead (already in the locked graph through Smithay's dependencies: no new crate). Unlike
# calloop's signalfd source it blocks no signal, so the session's children inherit no blocked mask.
libc = { version = "=0.2.190", default-features = false }
# Owner decision 2026-10-25: the compositor loads and draws the user's Xcursor theme for named
# cursors and the empty canvas; xcursor used to parse cursor themes and Xcursor images (already
# in the locked graph through Smithay's dependencies: no new crate).
xcursor = { version = "=0.3.11", default-features = false }

# Negative probes (OB-19); see tools/verify-architecture. Never enabled by default.
[features]
probe_store_port_in_state = []
probe_store_output_token_in_state = []
probe_sticky_fit = ["infynitae-core/probe_sticky_fit_retains_authority"]
probe_unsafe_block = []
probe_preemption_strategy = []
probe_nested_grab_keep_pointer = []
probe_test_keyboard_grab = []
