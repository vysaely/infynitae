[package]
name = "infynitae-architecture-probes"
description = "Protocol-side negative compile probes against the production crates (OB-19). Enforcement only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Each feature enables ONE forbidden path written as protocol-side code would write it (code holding
# `&mut Core` but no port). tools/verify-architecture builds each alone and requires failure with the
# asserted diagnostic and no other error; `p5_control_compiles` must build.
[dependencies]
infynitae-core = { path = "../../crates/infynitae-core" }
infynitae-wayland = { path = "../../crates/infynitae-wayland" }

[features]
p1_mutate_through_read_accessor = []
p2_forge_input_port = []
p3_physical_input_without_port = []
p4_call_navigation_internals = []
p5_control_compiles = []
p6_output_connected_without_token = []
p7_forge_output_token = []
p8_descriptor_with_coordinates = []
p9_public_restore_api = []
p10_reconfigure_without_token = []
p11_reconfigure_with_input_port = []
p12_reconfigure_descriptor_with_zoom = []
p13_reconfigure_with_camera_argument = []
p14_clone_output_token = []
p15_clone_input_port = []
p16_clone_shell_port = []
p17_clone_authorized = []
p18_hit_test_with_canvas_position = []
p19_canvas_value_as_device_delta = []
p20_pan_from_outside_core = []
p21_place_pointer_from_outside_core = []
p22_mutate_key_ownership = []
p23_forge_element_id = []
p24_set_focus_without_port = []
p25_set_preemption_strategy_in_production = []
p26_set_nested_grab_keep_pointer_in_production = []
p27_test_set_keyboard_grab_in_production = []
p28_portless_sync_seat_key = []
p29_keyboard_handle_outside_adapter = []
p30_input_auth_token_send = []
p31_input_auth_token_reuse = []

