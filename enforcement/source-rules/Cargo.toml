[package]
name = "infynitae-source-rules"
description = "Structural source rules for tools/verify-architecture (OB-19). Enforcement only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit", "visit-mut"] }
