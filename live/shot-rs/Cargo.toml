# Infynitae's screenshot helper (`infynitae-shot`): its own crate and lockfile, outside the
# compositor workspace, like live/edge-rs.
[package]
name = "infynitae-shot"
version = "0.1.0"
edition = "2021"
publish = false
description = "Infynitae's screenshot and region selector"

[[bin]]
name = "infynitae-shot"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.20", features = ["png"] }
libc = "0.2"
pango = "0.20"
pangocairo = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# not a member of the compositor's workspace
[workspace]
