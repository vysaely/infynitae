# Infynitae's file picker and file manager (`infynitae-files`): one crate and lockfile shared
# between portal picker mode (`--portal`, stage 1) and file manager mode (stage 2), outside the
# compositor workspace, like live/edge-apps and live/shot-rs.
[package]
name = "infynitae-files"
version = "0.1.0"
edition = "2021"
publish = false
description = "Infynitae's portal file picker and file manager"

[[bin]]
name = "infynitae-files"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.20", features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Pure-Rust in-process decoding for PNG, JPEG, WebP and GIF previews without pulling GObject
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
pango = "0.20"
pangocairo = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# not a member of the compositor's workspace
[workspace]
