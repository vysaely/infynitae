# Infynitae Native CI (OB-19, OB-36). Every job is blocking; there is no deploy, release or hardware job.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # smithay =0.7.0 links xkbcommon and pixman-1; the DRM backend needs udev, libinput, libseat, gbm, drm, wayland.
  NATIVE_DEPS: libxkbcommon-dev libpixman-1-dev libudev-dev libinput-dev libseat-dev libgbm-dev libdrm-dev libwayland-dev

jobs:
  # OB-36: the documentation checker, the knowledge checker and their seeded negative controls.
  foundation-docs:
    name: Foundation docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check-foundation-docs
      - run: ./tools/check-foundation-docs --self-test
      - run: ./tools/verify-knowledge --content-only
      - run: ./tools/verify-knowledge --self-test

  # The C helpers as the installer builds them, and the automount test.
  helpers:
    name: C helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libwayland-dev libxkbcommon-dev libpolkit-agent-1-dev libgtk-3-dev libcairo2-dev libpango1.0-dev libpam0g-dev libgdk-pixbuf-2.0-dev fonts-dejavu-core dbus libglib2.0-bin
      - run: sh live/build-helpers.sh "$PWD" "$RUNNER_TEMP/bin"
      - run: sh tools/test-automount
      - run: sh tools/test-format-drive
      - run: sh tools/test-sleep-lock
      - run: sh tools/test-edge-child-signals
      - run: sh tools/test-edge-app-search
      - run: sh tools/test-edge-config-value
      - run: sh tools/test-edge-render
      - run: sh tools/test-edge-ask
      - run: sh tools/test-edge-panel-lines
      - run: sh tools/test-mako-config
      - run: sh tools/test-config-renames
      - run: sh tools/test-config-check
      - run: sh tools/test-config-defaults
      - run: ./tools/test-readme-shortcuts
      - run: ./tools/test-readme-shortcuts --self-test
      - run: sh tools/test-reload-match
      - run: sh tools/test-launch-fast
      - run: sh tools/test-lock-render
      - run: sh tools/test-xdg-autostart
      - run: sh tools/test-theme-from-wallpaper
      - run: sh tools/test-settings-actions
      - run: sh tools/test-firefox-theme
      - run: sh tools/test-qt-theme
      - run: sh tools/test-portal-settings

  # The edge in Rust (docs/EDGE_RUST.md): its own crate in live/edge-rs, built, tested, and compared
  # with the C edge.
  edge-rs:
    name: Edge (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev libwayland-dev libxkbcommon-dev libcairo2-dev libpango1.0-dev fonts-dejavu-core
      - name: Toolchain pinned by rust-toolchain.toml
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: live/edge-rs
      - run: cd live/edge-rs && cargo fmt -- --check
      - run: cd live/edge-rs && cargo clippy --locked --all-targets -- -D warnings
      - run: cd live/edge-rs && cargo test --locked
      - run: sh tools/test-edge-rs
      # the edge itself, to render and try a change without building it on the owner's PC
      - run: cd live/edge-rs && cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: infynitae-edge-rs
          path: live/edge-rs/target/debug/infynitae-edge-rs
          retention-days: 7

  # OB-19: production architecture enforcement.
  verify-architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $NATIVE_DEPS
      - name: Toolchain pinned by rust-toolchain.toml
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: architecture
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./tools/verify-architecture

  # Format, build, tests and lints of the whole workspace.
  workspace-build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $NATIVE_DEPS
      - name: Toolchain pinned by rust-toolchain.toml
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Seeded behavioural defects must fail the product tests. The longest check (it re-runs the suite
  # per defect), so it runs on main, pull requests and nightly, not on every branch push.
  verify-test-efficacy:
    name: Test efficacy
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $NATIVE_DEPS
      - name: Toolchain pinned by rust-toolchain.toml
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
      - run: ./tools/verify-test-efficacy
