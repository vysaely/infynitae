[package]
name = "spike-wayland"
version = "0.0.0"
edition = "2021"
publish = false

# Stands in for the Smithay adapter: depends on core only (no Smithay needed to show the boundary).
[dependencies]
spike-core = { path = "../core" }

[features]
# negative clippy probe: storing an authority port in protocol state
probe_store_port_in_state = []
# PD-F2-01 (Phase D 1R): Core retains an authority proof for a sticky viewport-fit mode -> E0277
probe_sticky_fit = ["spike-core/probe_sticky_fit_retains_authority"]
